name: Generate 60-minute Python forecast

on:
  push:
    branches:
      - main
    paths:
      - data/schoolheat_readings.csv
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-forecast.txt

      - name: Install forecast dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-forecast.txt

      - name: Generate forecast.json
        env:
          FORECAST_DEVICE_ID: ${{ vars.FORECAST_DEVICE_ID }}
        run: python scripts/generate_forecast.py

      - name: Commit updated forecast
        if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 60-minute Python forecast"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
